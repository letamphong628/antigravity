<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity Web Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-hover: #2d2e30;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --border-color: #444746;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', sans-serif, -apple-system;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* LỚP PHỦ MỜ KHI MỞ MENU MOBILE */
        #sidebarOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 99;
        }

        /* SIDEBAR (THANH ĐIỀU HƯỚNG TRÁI) */
        #sidebar {
            width: 290px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-sidebar {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-close-sidebar:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        .btn-new-chat {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #0b57d0;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
        .btn-new-chat:hover { background-color: #0842a0; }

        .nav-items { list-style: none; margin-bottom: 16px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
        }
        .nav-item:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        /* THƯ MỤC LÀM VIỆC */
        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-add-session {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add-session:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        .session-list {
            list-style: none;
            overflow-y: auto;
            max-height: calc(100vh - 460px);
            margin-top: 6px;
        }
        .session-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .session-item.active, .session-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        /* FOOTER & NÚT TRỢ GIÚP */
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .help-row { display: flex; align-items: center; }
        .btn-help {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-help:hover { background-color: var(--bg-hover); color: var(--text-primary); border-color: var(--text-primary); }

        .user-profile { display: flex; align-items: center; justify-content: space-between; }
        .user-info-group { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background-color: #5c5f62; object-fit: cover; }
        .btn-auth {
            background: #2b2c2f;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* MAIN CONTENT VIEWPORT */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            min-width: 0;
        }

        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            height: 56px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 8px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 1;
            min-width: 0;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .model-picker select {
            background: #1e1f20;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            cursor: pointer;
            outline: none;
            max-width: 240px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .navbar-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* KHUNG CHAT */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 18%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-screen {
            margin: auto;
            text-align: center;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 2.1rem;
            font-weight: 500;
            margin-top: 14px;
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-row { display: flex; gap: 14px; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-content {
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .user .message-content {
            background-color: var(--bg-sidebar);
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
        }

        /* REALTIME REASONING BOX (CHUẨN ANTIGRAVITY ENGINE) */
        .reasoning-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--accent-blue);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 6px 12px 12px 6px;
            font-size: 0.86rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .reasoning-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .reasoning-title {
            font-weight: 500;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .thinking-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(168, 199, 250, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .reasoning-content {
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            color: #b0b4b8;
            white-space: pre-wrap;
            border-top: 1px dashed rgba(255, 255, 255, 0.06);
            padding-top: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .response-text {
            color: var(--text-primary);
            line-height: 1.65;
            word-break: break-word;
        }

        /* KHUNG NHẬP */
        .input-wrapper {
            padding: 10px 18% 24px;
            flex-shrink: 0;
        }

        .input-box {
            background-color: var(--bg-input);
            border-radius: 28px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .input-box textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            outline: none;
            font-size: 0.95rem;
            max-height: 120px;
            height: 24px;
        }

        .btn-send {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
        }
        .btn-send:hover { color: var(--accent-blue); }

        /* MODAL */
        #aboutModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e1f20;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            padding: 30px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .close-modal-x {
            position: absolute;
            top: 14px; right: 16px;
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 1.3rem; cursor: pointer;
        }

        .antigravity-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }

        .modal-text-title {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .modal-text-version { font-size: 0.85rem; color: var(--text-secondary); }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                transform: translateX(-100%);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            .chat-container { padding: 14px 16px; }
            .input-wrapper { padding: 8px 12px 18px; }
            .model-picker select { max-width: 160px; font-size: 0.8rem; }
            .welcome-screen h1 { font-size: 1.6rem; }
        }
    </style>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlHgCHi5q33UPtarrSm4e1NkI4V5sZ3yw",
            authDomain: "antigravity-authenticator.firebaseapp.com",
            projectId: "antigravity-authenticator",
            storageBucket: "antigravity-authenticator.firebasestorage.app",
            messagingSenderId: "435399566909",
            appId: "1:435399566909:web:0cb6f42907d364dd972c54",
            measurementId: "G-4F24VHBPMG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let activeSessionId = null;
        let unsubscribeSessions = null;
        let unsubscribeMessages = null;
        let isGenerating = false;

        window.loginGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("Lỗi đăng nhập: " + err.message);
            }
        };

        window.logoutGoogle = async () => {
            await signOut(auth);
            if (unsubscribeSessions) unsubscribeSessions();
            if (unsubscribeMessages) unsubscribeMessages();
            document.getElementById('sessionList').innerHTML = '';
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div style="font-size: 3rem;">✦</div>
                    <h1>Chúng ta nên bắt đầu từ đâu?</h1>
                </div>`;
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const profileDiv = document.getElementById('userProfile');
            if (user) {
                profileDiv.innerHTML = `
                    <div class="user-info-group">
                        <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/34'}" alt="Avatar">
                        <div style="overflow: hidden;">
                            <div style="font-weight:500; font-size:0.85rem; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${user.displayName}</div>
                            <div style="font-size: 0.72rem; color: var(--text-secondary);">Đã kết nối</div>
                        </div>
                    </div>
                    <button class="btn-auth" onclick="logoutGoogle()">Thoát</button>
                `;
                syncWorkspaces(user.uid);
            } else {
                profileDiv.innerHTML = `
                    <div class="user-info-group">
                        <div class="user-avatar"></div>
                        <div style="font-size:0.85rem; color:var(--text-secondary);">Chưa đăng nhập</div>
                    </div>
                    <button class="btn-auth" onclick="loginGoogle()">Google Login</button>
                `;
            }
        });

        function syncWorkspaces(uid) {
            const q = query(collection(db, "users", uid, "workspaces"), orderBy("createdAt", "desc"));
            unsubscribeSessions = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('sessionList');
                list.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const li = document.createElement('li');
                    li.className = `session-item ${docSnap.id === activeSessionId ? 'active' : ''}`;
                    li.textContent = data.title || "Cuộc trò chuyện mới";
                    li.onclick = () => {
                        switchSession(docSnap.id);
                        closeSidebar();
                    };
                    list.appendChild(li);
                });

                if (!activeSessionId && snapshot.docs.length > 0) {
                    switchSession(snapshot.docs[0].id);
                }
            });
        }

        window.createNewSession = async () => {
            if (!currentUser) {
                alert("Vui lòng đăng nhập Google để tạo và đồng bộ phiên làm việc!");
                return;
            }
            const title = prompt("Đặt tên phiên làm việc mới:", "Phiên nghiên cứu mới");
            if (!title) return;

            const docRef = await addDoc(collection(db, "users", currentUser.uid, "workspaces"), {
                title: title,
                createdAt: serverTimestamp()
            });
            switchSession(docRef.id);
            closeSidebar();
        };

        window.switchSession = (sessionId) => {
            activeSessionId = sessionId;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));

            if (unsubscribeMessages) unsubscribeMessages();

            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';

            const q = query(collection(db, "users", currentUser.uid, "workspaces", sessionId, "messages"), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                // Nếu bot đang stream trực tiếp thì không render đè lên
                if (isGenerating) return;

                chatContainer.innerHTML = '';
                if (snapshot.empty) {
                    chatContainer.innerHTML = `
                        <div class="welcome-screen" id="welcomeScreen">
                            <div style="font-size: 3rem;">✦</div>
                            <h1>Chúng ta nên bắt đầu từ đâu?</h1>
                        </div>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    renderStaticMessage(msg.role, msg.content, msg.reasoning, msg.model);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        };

        function renderStaticMessage(role, content, reasoning, model) {
            const chatContainer = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            let body = `<div class="message-content">`;
            if (role === 'bot' && reasoning) {
                body += `
                    <div class="reasoning-box">
                        <div class="reasoning-header" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display === 'none' ? 'block' : 'none')">
                            <span class="reasoning-title">⚙️ Quá trình suy luận (${model || 'Antigravity'})</span>
                            <span style="font-size: 0.75rem; color: var(--text-secondary);">▼</span>
                        </div>
                        <div class="reasoning-content" style="display:none;">${escapeHtml(reasoning)}</div>
                    </div>`;
            }
            body += `<div class="response-text">${escapeHtml(content)}</div></div>`;
            row.innerHTML = body;
            chatContainer.appendChild(row);
        }

        // ==========================================
        // ANTIGRAVITY REALTIME STREAMING & THINKING ENGINE
        // ==========================================
        window.sendMessage = async () => {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text || isGenerating) return;
            if (!currentUser || !activeSessionId) {
                alert("Vui lòng đăng nhập Google và chọn một phiên làm việc!");
                return;
            }

            const model = document.getElementById('modelSelector').value;
            input.value = '';
            isGenerating = true;

            const welcome = document.querySelector('.welcome-screen');
            if (welcome) welcome.remove();

            const chatContainer = document.getElementById('chatContainer');

            // 1. Render tin nhắn User
            const userRow = document.createElement('div');
            userRow.className = 'message-
