<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-hover: #2d2e30;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --border-color: #444746;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif, -apple-system; }
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-primary); overflow: hidden; }

        /* SIDEBAR */
        #sidebar {
            width: 290px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .brand-title { font-size: 1.25rem; font-weight: 500; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .btn-new-chat {
            display: flex; align-items: center; gap: 12px; background-color: #0b57d0; color: #ffffff;
            padding: 12px 16px; border-radius: 28px; border: none; cursor: pointer; font-weight: 500;
            width: 100%; margin-bottom: 16px; font-size: 0.95rem;
        }
        .btn-new-chat:hover { background-color: #0842a0; }

        .nav-items { list-style: none; margin-bottom: 16px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 0.95rem;
        }
        .nav-item:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        /* THƯ MỤC LÀM VIỆC */
        .workspace-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 4px; font-size: 0.85rem; color: var(--text-secondary);
            font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-add-session {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.3rem; cursor: pointer; border-radius: 50%; width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-add-session:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        .session-list { list-style: none; overflow-y: auto; max-height: calc(100vh - 430px); margin-top: 6px; }
        .session-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary); margin-bottom: 4px;
        }
        .session-item.active, .session-item:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        .sidebar-footer { padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .user-profile { display: flex; align-items: center; justify-content: space-between; }
        .user-info-group { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background-color: #5c5f62; object-fit: cover; }
        .btn-auth {
            background: #2b2c2f; border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 0.8rem;
        }

        /* MAIN VIEWPORT */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; }
        .model-picker select {
            background: #1e1f20; border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; outline: none;
        }

        .chat-container {
            flex-grow: 1; overflow-y: auto; padding: 20px 18%; display: flex; flex-direction: column; gap: 22px;
        }
        .welcome-screen { margin: auto; text-align: center; }
        .welcome-screen h1 {
            font-size: 2.2rem; font-weight: 500; margin-top: 14px;
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .message-row { display: flex; gap: 14px; }
        .message-row.user { justify-content: flex-end; }
        .message-content { max-width: 82%; line-height: 1.6; font-size: 0.98rem; }
        .user .message-content { background-color: var(--bg-sidebar); padding: 12px 18px; border-radius: 18px 18px 4px 18px; }

        /* KHỐI SUY LUẬN ANTIGRAVITY */
        .reasoning-box {
            background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--accent-blue);
            padding: 10px 14px; margin-bottom: 10px; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: var(--text-secondary);
            white-space: pre-wrap;
        }
        .reasoning-toggle { font-weight: 500; color: var(--accent-blue); margin-bottom: 4px; }

        .input-wrapper { padding: 10px 18% 28px; }
        .input-box {
            background-color: var(--bg-input); border-radius: 28px; padding: 14px 20px;
            display: flex; align-items: center; gap: 12px; border: 1px solid transparent;
        }
        .input-box:focus-within { border-color: var(--border-color); }
        .input-box textarea {
            flex-grow: 1; background: transparent; border: none; color: var(--text-primary);
            resize: none; outline: none; font-size: 1rem; max-height: 140px; height: 24px;
        }
        .btn-send { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.25rem; }
        .btn-send:hover { color: var(--accent-blue); }
    </style>

    <!-- FIREBASE SDK MODULAR -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Cấu hình Firebase đã điền đầy đủ thông số của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyAlHgCHi5q33UPtarrSm4e1NkI4V5sZ3yw",
            authDomain: "antigravity-authenticator.firebaseapp.com",
            projectId: "antigravity-authenticator",
            storageBucket: "antigravity-authenticator.firebasestorage.app",
            messagingSenderId: "435399566909",
            appId: "1:435399566909:web:0cb6f42907d364dd972c54",
            measurementId: "G-4F24VHBPMG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let activeSessionId = null;
        let unsubscribeSessions = null;
        let unsubscribeMessages = null;

        window.loginGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("Lỗi đăng nhập: " + err.message);
            }
        };

        window.logoutGoogle = async () => {
            await signOut(auth);
            if (unsubscribeSessions) unsubscribeSessions();
            if (unsubscribeMessages) unsubscribeMessages();
            document.getElementById('sessionList').innerHTML = '';
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div style="font-size: 3rem;">✦</div>
                    <h1>Chúng ta nên bắt đầu từ đâu?</h1>
                </div>`;
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const profileDiv = document.getElementById('userProfile');
            if (user) {
                profileDiv.innerHTML = `
                    <div class="user-info-group">
                        <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/34'}" alt="Avatar">
                        <div style="overflow: hidden;">
                            <div style="font-weight:500; font-size:0.85rem; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${user.displayName}</div>
                            <div style="font-size: 0.72rem; color: var(--text-secondary);">Đã kết nối</div>
                        </div>
                    </div>
                    <button class="btn-auth" onclick="logoutGoogle()">Thoát</button>
                `;
                syncWorkspaces(user.uid);
            } else {
                profileDiv.innerHTML = `
                    <div class="user-info-group">
                        <div class="user-avatar"></div>
                        <div style="font-size:0.85rem; color:var(--text-secondary);">Chưa đăng nhập</div>
                    </div>
                    <button class="btn-auth" onclick="loginGoogle()">Google Login</button>
                `;
            }
        });

        function syncWorkspaces(uid) {
            const q = query(collection(db, "users", uid, "workspaces"), orderBy("createdAt", "desc"));
            unsubscribeSessions = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('sessionList');
                list.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const li = document.createElement('li');
                    li.className = `session-item ${docSnap.id === activeSessionId ? 'active' : ''}`;
                    li.textContent = data.title || "Cuộc trò chuyện mới";
                    li.onclick = () => switchSession(docSnap.id);
                    list.appendChild(li);
                });

                if (!activeSessionId && snapshot.docs.length > 0) {
                    switchSession(snapshot.docs[0].id);
                }
            });
        }

        window.createNewSession = async () => {
            if (!currentUser) {
                alert("Vui lòng đăng nhập Google để tạo và đồng bộ phiên làm việc!");
                return;
            }
            const title = prompt("Đặt tên phiên làm việc mới:", "Phiên nghiên cứu mới");
            if (!title) return;

            const docRef = await addDoc(collection(db, "users", currentUser.uid, "workspaces"), {
                title: title,
                createdAt: serverTimestamp()
            });
            switchSession(docRef.id);
        };

        window.switchSession = (sessionId) => {
            activeSessionId = sessionId;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));

            if (unsubscribeMessages) unsubscribeMessages();

            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';

            const q = query(collection(db, "users", currentUser.uid, "workspaces", sessionId, "messages"), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = '';
                if (snapshot.empty) {
                    chatContainer.innerHTML = `
                        <div class="welcome-screen" id="welcomeScreen">
                            <div style="font-size: 3rem;">✦</div>
                            <h1>Chúng ta nên bắt đầu từ đâu?</h1>
                        </div>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    renderMessage(msg.role, msg.content, msg.reasoning, msg.model);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        };

        function renderMessage(role, content, reasoning, model) {
            const chatContainer = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            let body = `<div class="message-content">`;
            if (role === 'bot' && reasoning) {
                body += `
                    <div class="reasoning-box">
                        <div class="reasoning-toggle">⚙️ Suy luận Antigravity (${model || 'Core'})</div>
                        <div>${escapeHtml(reasoning)}</div>
                    </div>`;
            }
            body += `<div>${escapeHtml(content)}</div></div>`;
            row.innerHTML = body;
            chatContainer.appendChild(row);
        }

        window.sendMessage = async () => {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text) return;
            if (!currentUser || !activeSessionId) {
                alert("Vui lòng đăng nhập Google và chọn một phiên làm việc!");
                return;
            }

            const model = document.getElementById('modelSelector').value;
            input.value = '';

            // 1. Lưu tin nhắn User vào Firestore
            await addDoc(collection(db, "users", currentUser.uid, "workspaces", activeSessionId, "messages"), {
                role: "user",
                content: text,
                timestamp: serverTimestamp()
            });

            // 2. Tầng suy luận trực tiếp trên Client
            let simulatedReasoning = `• [Antigravity Engine] Phân tích cấu trúc prompt: "${text}"\n` +
                                     `• [Xác thực mô hình] Định tuyến đến hạt nhân suy luận ${model}.\n` +
                                     `• [Kiểm thử logic] Trạng thái phản hồi hoàn tất.`;
            let simulatedReply = `Hệ thống Antigravity Web Core đã nhận lệnh và xử lý thành công yêu cầu của bạn theo mô hình ${model}.`;

            // 3. Tự động lưu kết quả vào Firestore để đồng bộ theo thời gian thực
            await addDoc(collection(db, "users", currentUser.uid, "workspaces", activeSessionId, "messages"), {
                role: "bot",
                content: simulatedReply,
                reasoning: simulatedReasoning,
                model: model,
                timestamp: serverTimestamp()
            });
        };

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div>
            <div class="brand-title">
                <span style="color: #4285f4;">✦</span> Antigravity
            </div>

            <button class="btn-new-chat" onclick="createNewSession()">
                <span>＋</span> Cuộc trò chuyện mới
            </button>

            <ul class="nav-items">
                <li class="nav-item">🗂 Thư viện</li>
                <li class="nav-item">🕒 Đã lên lịch</li>
                <li class="nav-item">🎓 Sinh viên</li>
            </ul>

            <div class="workspace-header">
                <span>Thư Mục Làm Việc</span>
                <button class="btn-add-session" title="Tạo cuộc trò chuyện mới" onclick="createNewSession()">+</button>
            </div>
            
            <ul class="session-list" id="sessionList"></ul>
        </div>

        <div class="sidebar-footer">
            <div class="user-profile" id="userProfile">
                <div class="user-info-group">
                    <div class="user-avatar"></div>
                    <div style="font-size:0.85rem; color:var(--text-secondary);">Đang tải...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT VIEWPORT -->
    <div id="main-content">
        <div class="top-navbar">
            <div class="model-picker">
                <select id="modelSelector">
                    <option value="antigravity-deep-reasoning">Antigravity Thinking (Suy luận máy chủ)</option>
                    <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
                    <option value="gemini-1-5-pro">Gemini 1.5 Pro</option>
                    <option value="gemini-1-5-flash">Gemini 1.5 Flash</option>
                </select>
            </div>
            <div style="font-size: 0.88rem; color: var(--text-secondary);">Máy chủ Web: Hoạt động</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <div style="font-size: 3rem;">✦</div>
                <h1>Chúng ta nên bắt đầu từ đâu?</h1>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <button style="background:none; border:none; color:var(--text-secondary); font-size:1.2rem; cursor:pointer;">＋</button>
                <textarea id="promptInput" placeholder="Nhập câu hỏi hoặc yêu cầu Antigravity..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

</body>
</html>
