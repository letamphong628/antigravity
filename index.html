<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity Web Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-hover: #2d2e30;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --border-color: #444746;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', sans-serif, -apple-system;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* LỚP PHỦ MỜ KHI MỞ MENU MOBILE */
        #sidebarOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 99;
        }

        /* SIDEBAR (THANH ĐIỀU HƯỚNG TRÁI) */
        #sidebar {
            width: 290px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-sidebar {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-close-sidebar:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        .btn-new-chat {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #0b57d0;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
        .btn-new-chat:hover { background-color: #0842a0; }

        .nav-items { list-style: none; margin-bottom: 16px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
        }
        .nav-item:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        /* THƯ MỤC LÀM VIỆC */
        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-add-session {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add-session:hover { background-color: var(--bg-hover); color: var(--text-primary); }

        .session-list {
            list-style: none;
            overflow-y: auto;
            max-height: calc(100vh - 460px);
            margin-top: 6px;
        }
        .session-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .session-item.active, .session-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        /* FOOTER & NÚT TRỢ GIÚP */
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .help-row { display: flex; align-items: center; }
        .btn-help {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-help:hover { background-color: var(--bg-hover); color: var(--text-primary); border-color: var(--text-primary); }

        .user-profile { display: flex; align-items: center; justify-content: space-between; }
        .user-info-group { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background-color: #5c5f62; object-fit: cover; }
        .btn-auth {
            background: #2b2c2f;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* MAIN CONTENT VIEWPORT */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            min-width: 0;
        }

        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            height: 56px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 8px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 1;
            min-width: 0;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .model-picker select {
            background: #1e1f20;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            cursor: pointer;
            outline: none;
            max-width: 240px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .navbar-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* KHUNG CHAT */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 18%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-screen {
            margin: auto;
            text-align: center;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 2.1rem;
            font-weight: 500;
            margin-top: 14px;
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-row { display: flex; gap: 14px; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-content {
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .user .message-content {
            background-color: var(--bg-sidebar);
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
        }

        /* REALTIME REASONING BOX (CHUẨN ANTIGRAVITY ENGINE) */
        .reasoning-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--accent-blue);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 6px 12px 12px 6px;
            font-size: 0.86rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .reasoning-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .reasoning-title {
            font-weight: 500;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .thinking-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(168, 199, 250, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .reasoning-content {
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            color: #b0b4b8;
            white-space: pre-wrap;
            border-top: 1px dashed rgba(255, 255, 255, 0.06);
            padding-top: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .response-text {
            color: var(--text-primary);
            line-height: 1.65;
            word-break: break-word;
        }

        /* KHUNG NHẬP */
        .input-wrapper {
            padding: 10px 18% 24px;
            flex-shrink: 0;
        }

        .input-box {
            background-color: var(--bg-input);
            border-radius: 28px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .input-box textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            outline: none;
            font-size: 0.95rem;
            max-height: 120px;
            height: 24px;
        }

        .btn-send {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
        }
        .btn-send:hover { color: var(--accent-blue); }

        /* MODAL */
        #aboutModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e1f20;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            padding: 30px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .close-modal-x {
            position: absolute;
            top: 14px; right: 16px;
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 1.3rem; cursor: pointer;
        }

        .antigravity-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }

        .modal-text-title {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .modal-text-version { font-size: 0.85rem; color: var(--text-secondary); }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                transform: translateX(-100%);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            .chat-container { padding: 14px 16px; }
            .input-wrapper { padding: 8px 12px 18px; }
            .model-picker select { max-width: 160px; font-size: 0.8rem; }
            .welcome-screen h1 { font-size: 1.6rem; }
        }
    </style>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlHgCHi5q33UPtarrSm4e1NkI4V5sZ3yw",
            authDomain: "antigravity-authenticator.firebaseapp.com",
            projectId: "antigravity-authenticator",
            storageBucket: "antigravity-authenticator.firebasestorage.app",
            messagingSenderId: "435399566909",
            appId: "1:435399566909:web:0cb6f42907d364dd972c54",
            measurementId: "G-4F24VHBPMG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let activeSessionId = null;
        let unsubscribeSessions = null;
        let unsubscribeMessages = null;
        let isGenerating = false;

        window.loginGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("Lỗi đăng nhập: " + err.message);
            }
        };

        window.logoutGoogle = async () => {
            await signOut(auth);
            if (unsubscribeSessions) unsubscribeSessions();
            if (unsubscribeMessages) unsubscribeMessages();
            document.getElementById('sessionList').innerHTML = '';
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div style="font-size: 3rem;">✦</div>
                    <h1>Chúng ta nên bắt đầu từ đâu?</h1>
                </div>`;
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const profileDiv = document.getElementById('userProfile');
            if (user) {
                profileDiv.innerHTML = `
                    <div class="user-info-group">
                        <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/34'}" alt="Avatar">
                        <div style="overflow: hidden;">
                            <div style="font-weight:500; font-size:0.85rem; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${user.displayName}</div>
                            <div style="font-size: 0.72rem; color: var(--text-secondary);">Đã kết nối</div>
                        </div>
                    </div>
                    <button class="btn-auth" onclick="logoutGoogle()">Thoát</button>
                `;
                syncWorkspaces(user.uid);
            } else {
                profileDiv.innerHTML = `
                    <div class="user-info-group">
                        <div class="user-avatar"></div>
                        <div style="font-size:0.85rem; color:var(--text-secondary);">Chưa đăng nhập</div>
                    </div>
                    <button class="btn-auth" onclick="loginGoogle()">Google Login</button>
                `;
            }
        });

        function syncWorkspaces(uid) {
            const q = query(collection(db, "users", uid, "workspaces"), orderBy("createdAt", "desc"));
            unsubscribeSessions = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('sessionList');
                list.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const li = document.createElement('li');
                    li.className = `session-item ${docSnap.id === activeSessionId ? 'active' : ''}`;
                    li.textContent = data.title || "Cuộc trò chuyện mới";
                    li.onclick = () => {
                        switchSession(docSnap.id);
                        closeSidebar();
                    };
                    list.appendChild(li);
                });

                if (!activeSessionId && snapshot.docs.length > 0) {
                    switchSession(snapshot.docs[0].id);
                }
            });
        }

        window.createNewSession = async () => {
            if (!currentUser) {
                alert("Vui lòng đăng nhập Google để tạo và đồng bộ phiên làm việc!");
                return;
            }
            const title = prompt("Đặt tên phiên làm việc mới:", "Phiên nghiên cứu mới");
            if (!title) return;

            const docRef = await addDoc(collection(db, "users", currentUser.uid, "workspaces"), {
                title: title,
                createdAt: serverTimestamp()
            });
            switchSession(docRef.id);
            closeSidebar();
        };

        window.switchSession = (sessionId) => {
            activeSessionId = sessionId;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));

            if (unsubscribeMessages) unsubscribeMessages();

            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';

            const q = query(collection(db, "users", currentUser.uid, "workspaces", sessionId, "messages"), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                // Nếu bot đang stream trực tiếp thì không render đè lên
                if (isGenerating) return;

                chatContainer.innerHTML = '';
                if (snapshot.empty) {
                    chatContainer.innerHTML = `
                        <div class="welcome-screen" id="welcomeScreen">
                            <div style="font-size: 3rem;">✦</div>
                            <h1>Chúng ta nên bắt đầu từ đâu?</h1>
                        </div>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    renderStaticMessage(msg.role, msg.content, msg.reasoning, msg.model);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        };

        function renderStaticMessage(role, content, reasoning, model) {
            const chatContainer = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            let body = `<div class="message-content">`;
            if (role === 'bot' && reasoning) {
                body += `
                    <div class="reasoning-box">
                        <div class="reasoning-header" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display === 'none' ? 'block' : 'none')">
                            <span class="reasoning-title">⚙️ Quá trình suy luận (${model || 'Antigravity'})</span>
                            <span style="font-size: 0.75rem; color: var(--text-secondary);">▼</span>
                        </div>
                        <div class="reasoning-content" style="display:none;">${escapeHtml(reasoning)}</div>
                    </div>`;
            }
            body += `<div class="response-text">${escapeHtml(content)}</div></div>`;
            row.innerHTML = body;
            chatContainer.appendChild(row);
        }

        // ==========================================
        // ANTIGRAVITY REALTIME STREAMING & THINKING ENGINE
        // ==========================================
        window.sendMessage = async () => {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text || isGenerating) return;
            if (!currentUser || !activeSessionId) {
                alert("Vui lòng đăng nhập Google và chọn một phiên làm việc!");
                return;
            }

            const model = document.getElementById('modelSelector').value;
            input.value = '';
            isGenerating = true;

            const welcome = document.querySelector('.welcome-screen');
            if (welcome) welcome.remove();

            const chatContainer = document.getElementById('chatContainer');

            // 1. Render tin nhắn User
            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            chatContainer.appendChild(userRow);

            // 2. Lưu tin nhắn User lên Firestore
            await addDoc(collection(db, "users", currentUser.uid, "workspaces", activeSessionId, "messages"), {
                role: "user",
                content: text,
                timestamp: serverTimestamp()
            });

            // 3. Khởi tạo khung phản hồi Realtime của Bot
            const botRow = document.createElement('div');
            botRow.className = 'message-row bot';
            
            const msgContent = document.createElement('div');
            msgContent.className = 'message-content';

            const reasonBox = document.createElement('div');
            reasonBox.className = 'reasoning-box';
            reasonBox.innerHTML = `
                <div class="reasoning-header">
                    <span class="reasoning-title">
                        <span class="thinking-spinner"></span>
                        <span class="reasoning-label">Đang suy luận... (<span class="timer">0.0s</span>)</span>
                    </span>
                    <span style="font-size: 0.75rem; color: var(--text-secondary);">▼</span>
                </div>
                <div class="reasoning-content"></div>
            `;

            const respText = document.createElement('div');
            respText.className = 'response-text';

            msgContent.appendChild(reasonBox);
            msgContent.appendChild(respText);
            botRow.appendChild(msgContent);
            chatContainer.appendChild(botRow);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const reasonContentEl = reasonBox.querySelector('.reasoning-content');
            const timerEl = reasonBox.querySelector('.timer');
            const headerEl = reasonBox.querySelector('.reasoning-header');

            headerEl.onclick = () => {
                reasonContentEl.style.display = (reasonContentEl.style.display === 'none' ? 'block' : 'none');
            };

            // Bắt đầu đếm giây thời gian thực
            let startTime = performance.now();
            let timerInterval = setInterval(() => {
                let elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
                timerEl.textContent = `${elapsed}s`;
            }, 100);

            // Các bước suy luận động chuẩn logic Antigravity
            const reasoningSteps = [
                `[Core Context] Phân tích truy vấn người dùng: "${text}"`,
                `[Token Routing] Định tuyến luồng xử lý tới bộ điều khiển ${model}.`,
                `[Intent Extraction] Bóc tách mục tiêu, giải mã ngữ cảnh và đối chiếu dữ liệu hội thoại...`,
                `[Deep Validation] Kiểm chứng tính nhất quán và hoàn thành chuỗi logic.`
            ];

            let fullReasoning = "";

            // Stream từng bước suy luận ra màn hình
            for (let step of reasoningSteps) {
                fullReasoning += (fullReasoning ? "\n" : "") + step;
                reasonContentEl.textContent = fullReasoning;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await sleep(350);
            }

            // Kết thúc pha suy luận
            clearInterval(timerInterval);
            let finalTime = ((performance.now() - startTime) / 1000).toFixed(1);
            
            // Cập nhật giao diện suy luận hoàn tất & Tự động thu gọn
            reasonBox.querySelector('.thinking-spinner').remove();
            reasonBox.querySelector('.reasoning-label').textContent = `Đã suy luận xong trong ${finalTime}s (${model})`;
            reasonContentEl.style.display = 'none'; // Thu gọn lại cho thoáng mắt

            // 4. Tạo câu trả lời thông minh dựa theo câu hỏi
            let finalReply = "";
            let lowerText = text.toLowerCase();

            if (lowerText.includes("mày là ai") || lowerText.includes("bạn là ai")) {
                finalReply = `Tôi là hệ thống trí tuệ nhân tạo Antigravity Core, được phát triển và tối ưu hóa bởi Lê Tâm Phong (@Letamphong628). Tôi hoạt động với kiến trúc suy luận đa bước, đồng bộ dữ liệu thời gian thực và sẵn sàng hỗ trợ bạn lập trình, giải quyết vấn đề kỹ thuật cũng như điều phối dự án.`;
            } else if (lowerText.includes("chào") || lowerText.includes("hello")) {
                finalReply = `Xin chào Lê Tâm Phong! Tôi là Antigravity Core. Mọi hệ thống máy chủ và luồng suy luận đã sẵn sàng. Bạn muốn chúng ta triển khai tác vụ gì tiếp theo?`;
            } else {
                finalReply = `[Antigravity Core]: Yêu cầu "${text}" đã được xử lý qua hạt nhân ${model}. Hệ thống đã phân tích toàn bộ logic, đảm bảo không có xung đột và sẵn sàng cho các lệnh kế tiếp của bạn.`;
            }

            // Stream từng ký tự câu trả lời chính thức ra màn hình (Typing Effect)
            for (let i = 0; i < finalReply.length; i++) {
                respText.textContent += finalReply[i];
                if (i % 3 === 0) chatContainer.scrollTop = chatContainer.scrollHeight;
                await sleep(15);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 5. Lưu câu trả lời hoàn tất vào Firestore
            await addDoc(collection(db, "users", currentUser.uid, "workspaces", activeSessionId, "messages"), {
                role: "bot",
                content: finalReply,
                reasoning: fullReasoning,
                model: model,
                timestamp: serverTimestamp()
            });

            isGenerating = false;
        };

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
            }
        };

        window.closeSidebar = () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').style.display = 'none';
        };

        window.openAboutModal = () => {
            document.getElementById('aboutModal').style.display = 'flex';
        };

        window.closeAboutModal = () => {
            document.getElementById('aboutModal').style.display = 'none';
        };
    </script>
</head>
<body>

    <!-- OVERLAY -->
    <div id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div>
            <div class="sidebar-header">
                <div class="brand-title">
                    <span style="color: #4285f4;">✦</span> Antigravity
                </div>
                <button class="btn-close-sidebar" onclick="closeSidebar()" title="Đóng tab">✕</button>
            </div>

            <button class="btn-new-chat" onclick="createNewSession()">
                <span>＋</span> Cuộc trò chuyện mới
            </button>

            <ul class="nav-items">
                <li class="nav-item">🗂 Thư viện</li>
                <li class="nav-item">🕒 Đã lên lịch</li>
                <li class="nav-item">🎓 Sinh viên</li>
            </ul>

            <div class="workspace-header">
                <span>Thư Mục Làm Việc</span>
                <button class="btn-add-session" title="Tạo cuộc trò chuyện mới" onclick="createNewSession()">+</button>
            </div>
            
            <ul class="session-list" id="sessionList"></ul>
        </div>

        <div class="sidebar-footer">
            <div class="help-row">
                <button class="btn-help" onclick="openAboutModal()" title="Thông tin ứng dụng">?</button>
            </div>

            <div class="user-profile" id="userProfile">
                <div class="user-info-group">
                    <div class="user-avatar"></div>
                    <div style="font-size:0.85rem; color:var(--text-secondary);">Đang tải...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="main-content">
        <div class="top-navbar">
            <div class="navbar-left">
                <button class="menu-btn" onclick="toggleSidebar()" title="Mở menu">☰</button>
                <div class="model-picker">
                    <select id="modelSelector">
                        <option value="antigravity-deep-reasoning">Antigravity Thinking (Suy luận chuyên sâu)</option>
                        <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
                        <option value="gemini-1-5-pro">Gemini 1.5 Pro</option>
                        <option value="gemini-1-5-flash">Gemini 1.5 Flash</option>
                    </select>
                </div>
            </div>
            <div class="navbar-status">Web: Online</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <div style="font-size: 3rem;">✦</div>
                <h1>Chúng ta nên bắt đầu từ đâu?</h1>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <button style="background:none; border:none; color:var(--text-secondary); font-size:1.2rem; cursor:pointer;">＋</button>
                <textarea id="promptInput" placeholder="Nhập câu hỏi hoặc yêu cầu Antigravity..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- ABOUT MODAL -->
    <div id="aboutModal" onclick="if(event.target===this)closeAboutModal()">
        <div class="modal-content">
            <button class="close-modal-x" onclick="closeAboutModal()">✕</button>
            
            <svg class="antigravity-icon" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M50 8 C50 35 25 50 8 50 C25 50 50 65 50 92 C50 65 75 50 92 50 C75 50 50 35 50 8 Z" />
            </svg>

            <div class="modal-text-title">
                Antigravity Website (Build And Create By Letamphong628)
            </div>
            <div class="modal-text-version">
                Version: 1.0.0 (Beta)
            </div>
        </div>
    </div>

</body>
</html>
